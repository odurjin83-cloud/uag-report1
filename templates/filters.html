<form method="get" class="filters">{% if request.args.get("incomplete") %}<input type="hidden" name="incomplete" value="1">{% endif %}<label>Эхлэх огноо<input type="date" name="start_date" value="{{ start }}"></label><label>Дуусах огноо<input type="date" name="end_date" value="{{ end }}"></label>{% if leader %}<label>Хэлтэс<select name="dept"><option value="">Бүх хэлтэс</option>{% for d in departments %}<option {% if dept==d %}selected{% endif %}>{{ d }}</option>{% endfor %}</select></label>{% endif %}{% if request.path == '/' %}<label>Хайх<input name="q" value="{{ request.args.get('q','') }}" placeholder="Ажил, үр дүн, хариуцагч"></label>{% endif %}<button>Шүүх</button></form>
<div class="presets"><a href="{{ request.path }}?preset=this_week&amp;dept={{ dept|urlencode }}">Энэ 7 хоног</a><a href="{{ request.path }}?preset=last_week&amp;dept={{ dept|urlencode }}">Өнгөрсөн 7 хоног</a><a href="{{ request.path }}?preset=this_month&amp;dept={{ dept|urlencode }}">Энэ сар</a></div>
