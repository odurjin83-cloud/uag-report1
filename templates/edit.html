{% extends 'base.html' %}{% block content %}<section class="card"><h1>Тайлан засах</h1><p>{{ report.department }}</p><form method="post" class="edit"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Тайлант огноо<input type="date" name="report_date" value="{{ report.report_day or '' }}" required></label><label>Чиг үүрэг<select name="func_area" required>{% if report.func_area not in categories %}<option value="" selected disabled>Хуучин чиг үүрэг: {{ report.func_area }}. Зөв чиг үүрэг сонгоно уу.</option>{% endif %}{% for c in categories %}<option {% if c==report.func_area %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Ажлын мэдээлэл<textarea name="task_desc" required>{{ report.task_desc }}</textarea></label><label>Үр дүн<textarea name="task_result">{{ report.task_result or '' }}</textarea></label><label>Явц (%)<input name="progress" value="{{ report.progress.replace('%','') }}" type="number" min="0" max="100" step="0.1" required></label><label>Хариуцагч<input name="assignee" value="{{ report.assignee or '' }}"></label><label>Шийдвэрлүүлэх асуудал<textarea name="issue">{{ report.issue or '' }}</textarea></label><button>Хадгалах</button></form></section>{% endblock %}
